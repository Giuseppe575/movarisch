<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOVARISCH - Scheda cumulativa multi-prodotto</title>
<style>
:root{--bg:#081120;--card:#101c31;--line:#2a3b59;--ink:#edf3ff;--muted:#aab9d2;--accent:#78a1ff;--ok:#36c987;--warn:#f0b44c;--danger:#ff6878;--purple:#c184ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,Segoe UI,Arial,sans-serif}.page{max-width:1320px;margin:0 auto;padding:28px}.toolbar{display:flex;justify-content:space-between;gap:12px;margin-bottom:18px}.btn{border:1px solid #45628f;background:#172746;color:var(--ink);padding:10px 15px;border-radius:9px;text-decoration:none;cursor:pointer;font-weight:700}.btn.primary{background:var(--accent);color:#071021;border-color:var(--accent)}header{padding:24px;background:linear-gradient(135deg,#142745,#0e1930);border:1px solid var(--line);border-radius:16px}h1{margin:0;font-size:28px}header p{margin:8px 0 0;color:var(--muted)}.section{margin-top:18px;padding:20px;background:var(--card);border:1px solid var(--line);border-radius:14px}.section h2{margin:0 0 15px;font-size:20px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:12px}.metric{padding:15px;background:#0b172a;border:1px solid var(--line);border-radius:11px}.metric span{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}.metric strong{display:block;margin-top:5px;font-size:25px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{border-collapse:collapse;width:100%;min-width:950px;background:#0b172a}th,td{padding:10px 11px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}th{position:sticky;top:0;background:#1a3152;color:#fff;font-size:12px;text-transform:uppercase}tbody tr:last-child td{border-bottom:0}.badge{display:inline-block;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:800}.ok{background:#123b2b;color:#78e0ac}.warn{background:#3c2c11;color:#ffd17a}.danger{background:#451821;color:#ffadb6}.purple{background:#321c48;color:#dbb5ff}.muted{background:#243047;color:#c3cee0}.dpi-grid{display:grid;gap:12px}.dpi-card{padding:14px;border:1px solid var(--line);border-radius:11px;background:#0b172a}.dpi-card h3{margin:0 0 10px;font-size:16px}.dpi-table{min-width:760px}.dpi-table td:first-child{width:190px}.dpi-table td:nth-child(2){width:210px}.dpi-source{color:#cbd6e9;font-size:13px}.notice{padding:12px 14px;border-left:4px solid var(--warn);background:#2b2518;color:#ffe1a2;border-radius:7px}.interventions{margin:0;padding-left:22px}.interventions li{margin:8px 0}.empty{color:var(--muted);font-style:italic}.footer-note{color:var(--muted);font-size:12px;margin-top:14px}@media(max-width:800px){.page{padding:14px}.metrics{grid-template-columns:1fr 1fr}.toolbar{flex-wrap:wrap}}@media print{body{background:#fff;color:#111}.page{max-width:none;padding:0}.toolbar{display:none}header,.section{background:#fff;border-color:#aaa;break-inside:avoid}.metric,.dpi-card,table{background:#fff;border-color:#aaa}th{position:static;background:#e8edf5;color:#111}.muted,.ok,.warn,.danger,.purple{background:#eee;color:#111}.notice{background:#fff3d5;color:#111}.table-wrap{overflow:visible}table{min-width:0;font-size:10px}.dpi-source,.footer-note,header p{color:#333}}
</style>
</head>
<body>
<main class="page">
  <div class="toolbar"><a class="btn" href="index.html">← Torna alla valutazione</a><button class="btn primary" type="button" onclick="window.print()">Stampa / Salva PDF</button></div>
  <header><h1>Scheda cumulativa del rischio chimico</h1><p>Riepilogo multi-prodotto basato sulle valutazioni confermate e sulle indicazioni DPI riportate nella Sezione 8 delle SDS.</p></header>
  <div id="report"></div>
</main>
<script>
(function(){
  'use strict';
  const report = document.getElementById('report');
  const raw = localStorage.getItem('movarisch_cumulative_data');
  localStorage.removeItem('movarisch_cumulative_data');

  const esc = value => String(value == null ? '' : value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const number = value => Number.isFinite(Number(value)) ? Number(value) : 0;
  const fmt = value => number(value).toFixed(2);
  const list = value => Array.isArray(value) ? value : [];
  const max = (rows, getter) => rows.reduce((result,row) => Math.max(result, number(getter(row))), 0);
  const risk = value => {
    const n=number(value);
    if(n>80)return {label:'Grave',css:'danger'};
    if(n>40)return {label:'Elevato',css:'purple'};
    if(n>=21)return {label:'Superiore',css:'danger'};
    if(n>=15)return {label:'Intervallo di incertezza',css:'warn'};
    return {label:'Irrilevante per la salute',css:'ok'};
  };
  const badge = (text,css) => `<span class="badge ${css}">${esc(text)}</span>`;

  let data;
  try{
    data=JSON.parse(raw || 'null');
    const age=Date.now()-new Date(data?.timestamp).getTime();
    if(!Array.isArray(data?.rows)||!data.rows.length||!Number.isFinite(age)||age<0||age>300000)throw new Error('Dati assenti o scaduti');
  }catch(error){
    report.innerHTML=`<section class="section"><h2>Dati non disponibili</h2><p>Apri questa scheda dal pulsante “Scheda cumulativa” dopo aver confermato le SDS.</p></section>`;
    return;
  }

  const rows=data.rows;
  const maxHealth=max(rows,row=>row.Rtot);
  const maxSafety=max(rows,row=>row.IRC);
  const maxOverall=max(rows,row=>row.OverallRiskValue);
  const healthRisk=risk(maxHealth);
  const reviewers=[...new Set(rows.map(row=>row.review?.reviewer).filter(Boolean))];
  const confirmed=rows.filter(row=>row.review?.status==='confirmed').length;
  const cmr=rows.filter(row=>row.isCmr).length;

  const productRows=rows.map((row,index)=>{
    const health=risk(row.Rtot);
    return `<tr><td>${index+1}</td><td><strong>${esc(row.nome||row.file)}</strong><br><small>${esc(row.file)}</small></td><td>${esc(list(row.hcodes).join(', ')||'—')}</td><td>${fmt(row.SCORE)}</td><td>${fmt(row.Rtot)}<br>${badge(health.label,health.css)}</td><td>${esc(list(row.hcodesPhysical).join(', ')||'—')}</td><td>${fmt(row.IRC)}<br>${esc(row.mircText||row.mircLevel||'—')}</td><td>${fmt(row.OverallRiskValue)}</td></tr>`;
  }).join('');

  const categories=[
    ['hands','Protezione delle mani'],['eyesFace','Protezione occhi/viso'],['body','Protezione pelle/corpo'],['respiratory','Protezione respiratoria']
  ];
  const outcome={
    required:['Indicato dalla SDS','danger'],recommended:['Consigliato dalla SDS','warn'],conditional:['Condizionato allo scenario','warn'],mentioned:['Citato: da verificare','muted'],not_required:['Non richiesto dalla SDS','ok'],not_specified:['Non specificato','muted']
  };
  const dpiCards=categories.map(([key,label])=>{
    const entries=rows.map(row=>{
      const item=list(row.sdsEvidence?.dpi?.items).find(candidate=>candidate.category===key);
      return {product:row.nome||row.file,status:'not_specified',sourceText:'Nessuna indicazione strutturata rilevata.',...(item||{})};
    });
    const entryRows=entries.map(item=>{
      const [outcomeText,outcomeClass]=outcome[item.status]||outcome.mentioned;
      const source=item.sourceText ? `${item.page?`pag. ${esc(item.page)} · `:''}${esc(item.sourceText.slice(0,360))}` : 'Nessuna indicazione strutturata rilevata.';
      return `<tr><td><strong>${esc(item.product)}</strong></td><td>${badge(outcomeText,outcomeClass)}</td><td class="dpi-source">${source}</td></tr>`;
    }).join('');
    return `<div class="dpi-card"><h3>${esc(label)}</h3><div class="table-wrap"><table class="dpi-table"><thead><tr><th>Prodotto</th><th>Giudizio dalla SDS</th><th>Indicazione e pagina</th></tr></thead><tbody>${entryRows}</tbody></table></div></div>`;
  }).join('');

  const interventions=[];
  if(cmr)interventions.push(`${cmr} prodotto/i con classificazione CMR 1A/1B: applicare il percorso specifico del Titolo IX, Capo II.`);
  if(maxHealth>=21)interventions.push('Rischio salute superiore all’irrilevante: verificare e applicare le misure previste dagli artt. 225, 226, 229 e 230 del D.Lgs. 81/08.');
  else if(maxHealth>=15)interventions.push('Presente intervallo di incertezza: riesaminare punteggi, misure adottate e confronto con il medico competente.');
  if(rows.some(row=>list(row.hcodesPhysical).length))interventions.push('Sono presenti pericoli fisici: verificare sorgenti di innesco, incompatibilità, stoccaggio e procedure di emergenza per i prodotti interessati.');
  if(rows.some(row=>!row.sdsEvidence?.dpi?.sectionFound))interventions.push('Per almeno una SDS la Sezione 8 non è stata riconosciuta: controllare manualmente i DPI prima di chiudere la valutazione.');
  interventions.push('Confermare i DPI rispetto a mansione, durata, quantità, modalità d’uso e misure tecniche effettivamente presenti.');
  interventions.push('Aggiornare formazione, procedure operative e disponibilità delle SDS nei luoghi di utilizzo.');

  report.innerHTML=`
    <section class="section"><h2>1. Quadro generale</h2><div class="metrics">
      <div class="metric"><span>Prodotti valutati</span><strong>${rows.length}</strong></div>
      <div class="metric"><span>Valutazioni confermate</span><strong>${confirmed}/${rows.length}</strong></div>
      <div class="metric"><span>Massimo rischio salute</span><strong>${fmt(maxHealth)}</strong>${badge(healthRisk.label,healthRisk.css)}</div>
      <div class="metric"><span>Massimo indice sicurezza</span><strong>${fmt(maxSafety)}</strong></div>
    </div><p class="footer-note">Data: ${esc(new Date().toLocaleString('it-IT'))} · Professionista/i: ${esc(reviewers.join(', ')||'non indicato')} · Massimo complessivo registrato: ${fmt(maxOverall)}</p></section>
    <section class="section"><h2>2. Riepilogo di tutti i prodotti</h2><div class="table-wrap"><table id="productsTable"><thead><tr><th>#</th><th>Prodotto</th><th>H salute (Sez. 2)</th><th>Score</th><th>R salute</th><th>H fisiche</th><th>IRC sicurezza</th><th>Complessivo</th></tr></thead><tbody>${productRows}</tbody></table></div></section>
    <section class="section"><h2>3. Matrice DPI ricavata dalla Sezione 8</h2><div class="notice">La SDS indica o raccomanda i dispositivi, ma l’obbligatorietà finale deriva dalla valutazione professionale delle condizioni reali di lavoro. Le indicazioni condizionate non devono essere trasformate automaticamente in obblighi generalizzati.</div><div class="dpi-grid" style="margin-top:14px">${dpiCards}</div></section>
    <section class="section"><h2>4. Misure e verifiche prioritarie</h2><ol class="interventions">${interventions.map(item=>`<li>${esc(item)}</li>`).join('')}</ol></section>
    <section class="section"><h2>5. Validazione</h2><p>Il presente riepilogo integra ${rows.length} SDS. Le classificazioni del prodotto derivano dalla Sezione 2; la Sezione 16 resta informativa; i DPI sono estratti dalla Sezione 8 e devono essere confermati in relazione alle condizioni operative effettive.</p></section>`;
})();
</script>
</body>
</html>
